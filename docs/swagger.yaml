          description: No Content
      security:
      - CookieAuth: []
      summary: Revoke a permission from a role
      tags:
      - admin/roles
  /admin/users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.UserResponse'
      security:
      - CookieAuth: []
      summary: Get user with role
      tags:
      - admin/users
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role change payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.ChangeRoleRequest'
      produces:
