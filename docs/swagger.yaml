      parameters:
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.RoleResponse'
      security:
      - CookieAuth: []
      summary: Create a new role
