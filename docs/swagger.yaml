            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - system
  /posts:
    get:
      description: Public. Returns summaries of published posts, newest first. Full
        content is not included; fetch a single post by slug for that. Out-of-range
        page and limit values are clamped.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
