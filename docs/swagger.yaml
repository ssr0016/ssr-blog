host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: ssrBlog - Personal blog with session auth and RBAC
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ssrBlog API
  version: "1.0"
paths:
  /admin/permissions:
    get:
      parameters:
      - description: Filter by resource
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PermissionResponse'
            type: array
      security:
      - CookieAuth: []
      summary: List all permissions
      tags:
      - admin/permissions
    post:
      consumes:
      - application/json
      parameters:
      - description: Permission payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PermissionResponse'
      security:
      - CookieAuth: []
      summary: Create a new permission
      tags:
      - admin/permissions
  /admin/permissions/{id}:
    delete:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Delete a permission
      tags:
      - admin/permissions
    get:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PermissionResponse'
      security:
      - CookieAuth: []
      summary: Get permission by ID
      tags:
      - admin/permissions
  /admin/posts:
    get:
      description: Admin only. Returns summaries of posts of any status, newest created
        first, without content. Soft-deleted posts are not listed. Optional status
        filter; out-of-range page and limit values are clamped.
      parameters:
      - description: Filter by status
        enum:
        - draft
        - published
        in: query
        name: status
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_pkg_pagination.Response-github_com_ssr0016_ssr-blog_internal_model_AdminPostSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List blog posts
      tags:
      - admin/posts
    post:
      consumes:
      - application/json
      description: Admin only. The slug is generated from the title and never changes
        afterwards. Status defaults to draft. Content is stored exactly as written;
        it is not rendered or sanitized.
      parameters:
      - description: Post payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a blog post
      tags:
      - admin/posts
  /admin/posts/{id}:
    delete:
      description: 'Admin only. Soft delete: the post disappears from public and admin
        reads, but its row is kept and its slug is never reused. Deleting an unknown
        or already deleted post is a 404.'
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete a blog post
      tags:
      - admin/posts
    get:
      description: Admin only. Returns a post of any status, including drafts. Soft-deleted
        posts are not found.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get a blog post by ID
      tags:
      - admin/posts
    put:
      consumes:
      - application/json
      description: Admin only. Replaces title, content, excerpt, cover image and status.
        The slug never changes and any slug in the body is ignored. Moving a draft
        to published sets published_at; editing an already published post keeps it;
        moving to draft clears it.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Post payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_apperror.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update a blog post
      tags:
      - admin/posts
  /admin/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.RoleResponse'
