      tags:
      - admin/roles
    get:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_ssr-blog_internal_model.RoleResponse'
      security:
      - CookieAuth: []
